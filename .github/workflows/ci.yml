name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements-docker.txt
      - name: Syntax
        run: python -m py_compile src/*.py tests/*.py
      - name: i18n keys
        run: python tests/test_i18n.py
      - name: path helpers
        run: python tests/test_paths.py
      - name: discover helpers
        run: python tests/test_discover.py
      - name: auth
        run: python -m unittest tests/test_auth.py -v

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/tuya-ipc-terminal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache-dependency-path: vendor/tuya-ipc-terminal/go.sum
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/tuya-ipc-terminal .
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
